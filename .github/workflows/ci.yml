name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src tests scripts

      - name: Test
        run: uv run pytest --cov=konwledge --cov-report=term-missing

      - name: Demo snapshot is up to date
        run: |
          uv run knowledge demo build --force --workspace "$RUNNER_TEMP/demo"
          uv run knowledge demo export --workspace "$RUNNER_TEMP/demo" --check

      - name: Import demo evaluation dataset
        run: |
          uv run knowledge evaluation import examples/evaluation-demo.json -d "$RUNNER_TEMP/demo/knowledge.db"

      - name: Evaluate demo retrieval at a fixed time
        run: |
          uv run knowledge evaluation run 52522ebd-b1dc-4ace-824c-f8054c8547af --version 1 --mode lexical --top-k 5 --candidate-limit 50 --rrf-k 60 --at 2026-11-10T00:00:00Z -d "$RUNNER_TEMP/demo/knowledge.db" --json > "$RUNNER_TEMP/evaluation-candidate.json"

      # 默认严格策略：六项指标同时检查汇总与逐 case，绝对降幅为零。
      # 提交的 CI 策略另要求有效评测时间一致；CI 只读取基线，绝不自动更新。
      - name: Gate demo retrieval against the committed baseline
        run: |
          uv run knowledge evaluation gate examples/evaluation-baseline.json "$RUNNER_TEMP/evaluation-candidate.json" --policy examples/evaluation-gate.json --json > "$RUNNER_TEMP/evaluation-gate.json"

      - name: Verify wheel and source distribution
        run: uv run python scripts/verify_distribution.py --output-dir "$RUNNER_TEMP/distribution"

      - name: Upload evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/evaluation-candidate.json
            ${{ runner.temp }}/evaluation-gate.json
          if-no-files-found: ignore

      - name: Upload verified distributions and smoke summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: distribution-${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/distribution/build/*.whl
            ${{ runner.temp }}/distribution/build/*.tar.gz
            ${{ runner.temp }}/distribution/*-smoke-summary.json
          if-no-files-found: ignore

  web:
    name: Demo site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify demo types, tests, and production build
        run: pnpm verify

  lancedb:
    name: Optional LanceDB adapter
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies with the lancedb extra
        run: uv sync --locked --dev --extra lancedb

      - name: Test LanceDB adapter
        run: uv run pytest tests/test_indexing.py -k lance

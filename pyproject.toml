[project]
name = "konwledge"
version = "0.0.0"
description = "A local-first knowledge lifecycle and evaluation toolkit."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Ykontheway" },
]
keywords = ["knowledge-management", "rag", "evaluation", "llm"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.urls]
Repository = "https://github.com/Ykontheway/konwledge"
Issues = "https://github.com/Ykontheway/konwledge/issues"

[project.scripts]
konwledge = "konwledge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "mypy>=1.18.2,<2",
  "pytest>=8.4.2,<9",
  "pytest-cov>=7.0.0,<8",
  "ruff>=0.14.0,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/konwledge"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["konwledge"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
